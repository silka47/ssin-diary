<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🪽</title>
  
  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121417" id="theme-color-meta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🪽</span>
        <h1 class="brand-title">스신말기</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" aria-label="다크 모드 전환">🌙</button>
    </header>

    <!-- 작성자 / 날짜 카드 -->
    <section class="meta-section card">
      <div class="meta-row">
        <div class="meta-col">
          <label for="user-name">👤 작성자</label>
          <input type="text" id="user-name" value="준영" class="meta-input">
        </div>
        <div class="meta-col">
          <label for="diary-date">📅 작성 날짜</label>
          <input type="text" id="diary-date" class="meta-input">
        </div>
      </div>
      <div class="status-row">
        <span class="status-badge" id="save-status">
          <span class="status-dot"></span>
          <span id="save-status-text">저장 대기 중</span>
        </span>
      </div>
    </section>

    <!-- 미니 달력 (Habit Tracker) -->
    <section class="calendar-section card">
      <div class="calendar-top">
        <div class="calendar-header">
          <button type="button" id="prev-month-btn" class="cal-nav-btn">&lt;</button>
          <h2 id="calendar-title">2026.09</h2>
          <button type="button" id="next-month-btn" class="cal-nav-btn">&gt;</button>
        </div>
        <div class="calendar-stats">
          <span class="stat-badge done" id="stat-done">작성: 0일</span>
          <span class="stat-badge missed" id="stat-missed">미작성: 0일</span>
        </div>
      </div>

      <div class="calendar-grid weekdays">
        <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
      </div>
      <div id="calendar-days" class="calendar-grid days"></div>

      <div class="calendar-legend">
        <span class="legend-item"><span class="legend-mark done">✅</span> 작성 완료</span>
        <span class="legend-item"><span class="legend-mark today">🔵</span> 오늘</span>
        <span class="legend-item"><span class="legend-mark missed">▫️</span> 미작성</span>
      </div>
    </section>

    <!-- 일기 폼 -->
    <form id="diary-form" class="form-container">
      <!-- Step 1: 스케줄 (자연스럽고 예쁜 카드 박스 구조) -->
      <section class="card form-step">
        <div class="step-card-header">
          <span class="step-badge">🤍 step.1 스케줄</span>
        </div>
        
        <!-- 오늘 일정 영역 -->
        <div class="schedule-block">
          <div class="schedule-title-bar">
            <span class="schedule-title">⏰ 오늘 (⭕️❌)</span>
          </div>
          <div id="today-schedule-list" class="schedule-items-container">
            <!-- JS 동적 생성 -->
          </div>
          <button type="button" id="add-today-row-btn" class="add-box-btn">+ 오늘 일정 추가</button>
        </div>

        <!-- 내일 일정 영역 -->
        <div class="schedule-block">
          <div class="schedule-title-bar">
            <span class="schedule-title">⏰ 내일</span>
          </div>
          <div id="tomorrow-schedule-list" class="schedule-items-container">
            <!-- JS 동적 생성 -->
          </div>
          <button type="button" id="add-tomorrow-row-btn" class="add-box-btn">+ 내일 일정 추가</button>
        </div>
      </section>

      <!-- Step 2: 미디어 디톡스 -->
      <section class="card form-step">
        <div class="step-card-header">
          <span class="step-badge">🤍 step.2 미디어 디톡스</span>
        </div>
        <p class="sub-legend">▫️ 오늘 사용량</p>
        <div class="input-block">
          <label for="media-search">검색 :</label>
          <input type="text" id="media-search">
        </div>
        <div class="input-block">
          <label for="media-sns">커뮤니티, SNS, 유튜브 :</label>
          <input type="text" id="media-sns">
        </div>
        <div class="input-block">
          <label for="media-video">영상물 :</label>
          <input type="text" id="media-video">
        </div>
        <div class="input-block">
          <label for="media-etc">기타 :</label>
          <input type="text" id="media-etc">
        </div>
      </section>

      <!-- Step 3: 묵상 -->
      <section class="card form-step">
        <div class="step-card-header">
          <span class="step-badge">🤍 step.3 묵상</span>
        </div>
        <div class="input-block">
          <label for="meditation-chapter">🕯️ 성경 장</label>
          <input type="text" id="meditation-chapter">
        </div>
        <div class="input-block">
          <label for="meditation-content">와닿은 구절 &amp; 와닿은 이유 및 느낀점</label>
          <textarea id="meditation-content" rows="4"></textarea>
        </div>
      </section>

      <!-- Step 4: 신앙일기 -->
      <section class="card form-step">
        <div class="step-card-header">
          <span class="step-badge">🤍 step.4 신앙일기</span>
        </div>
        <div class="input-block">
          <label for="faith-emotion">• 오늘 느낀 감정의 종류</label>
          <input type="text" id="faith-emotion">
        </div>
        <div class="input-block">
          <label for="faith-situation">감정을 느낀 상황은 무엇인가요?</label>
          <textarea id="faith-situation" rows="2"></textarea>
        </div>
        <div class="input-block">
          <label for="faith-desire">나의 본심찾기 (나의 욕구:내가 원한 것)</label>
          <textarea id="faith-desire" rows="2"></textarea>
        </div>
        <div class="input-block">
          <label for="faith-lesson">이 일을 통해 하나님께서 내게 알려주시고 싶으신 것은 무엇이었을까? (하나님의 도우심, 깨달은 점)</label>
          <textarea id="faith-lesson" rows="3"></textarea>
        </div>
        
        <div class="sub-group">
          <span class="sub-label">💛 감사한 점</span>
          <input type="text" id="faith-gratitude-1" class="mb-sm">
          <input type="text" id="faith-gratitude-2">
        </div>

        <div class="sub-group">
          <span class="sub-label">🙏🏻 회개할 점</span>
          <input type="text" id="faith-repent-1" class="mb-sm">
          <input type="text" id="faith-repent-2">
        </div>
      </section>

      <!-- Step 5: 기도문 -->
      <section class="card form-step">
        <div class="step-card-header">
          <span class="step-badge">🤍 step.5 기도문</span>
        </div>
        <div class="input-block">
          <textarea id="prayer-content" rows="4"></textarea>
        </div>
        <div class="fixed-scripture">
          🧎🏻 시 62:1 나의 영혼이 잠잠히 하나님만 바람이여 나의 구원이 그에게서 나는도다
        </div>
      </section>

      <!-- 하단 액션 버튼 -->
      <div class="action-footer">
        <button type="button" id="copy-btn" class="primary-btn">작성 완료 및 복사</button>
        <button type="button" id="reset-btn" class="secondary-btn">초기화</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast">클립보드에 복사되었습니다.</div>

  <script src="app.js"></script>
</body>
</html>
